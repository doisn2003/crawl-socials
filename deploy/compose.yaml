services:
  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      FINDLINK_DOMAIN: ${FINDLINK_DOMAIN:?FINDLINK_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./downloads:/srv/downloads:ro
      - tls_data:/data
      - caddy_config:/config
  backend:
    build:
      context: ..
    env_file: ./findlink.env
    environment:
      NODE_ENV: production
      FINDLINK_BIND: 127.0.0.1
      FINDLINK_PORT: "9070"
      FINDLINK_TRUST_LOCAL_PROXY: "1"
    network_mode: service:edge
    restart: unless-stopped
    depends_on: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9070/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  tls_data:
  caddy_config:
