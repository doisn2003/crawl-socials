name: FindLink Starter Windows QA

on:
  push:
    branches: [findlink-publish-1st]
    paths:
      - '.github/workflows/findlink-starter-windows-qa.yml'
      - '.node-version'
      - 'package*.json'
      - 'src/**'
      - 'scripts/**'
      - 'tsconfig*.json'

permissions:
  contents: read

concurrency:
  group: starter-windows-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build two QA installers
        shell: pwsh
        run: |
          foreach ($version in @('0.5.4', '0.5.5')) {
            $env:FINDLINK_STARTER_VERSION = $version
            npm run dist:starter:qa
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify Windows install, upgrade and reinstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP ('findlink-starter-qa-' + [guid]::NewGuid().ToString('N'))
          $executable = Join-Path $installDir 'FindLink Starter QA.exe'
          $uninstaller = Join-Path $installDir 'Uninstall FindLink Starter QA.exe'
          $appData = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'FindLink Starter QA'

          function Install-Qa([string] $Version, [switch] $Update) {
            $setup = (Resolve-Path -LiteralPath "release/starter-qa/FindLink-Starter-QA-$Version-Setup.exe").Path
            $flags = if ($Update) { '/S --updated' } else { '/S' }
            $process = Start-Process -FilePath $setup -ArgumentList "$flags /D=$installDir" -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0 -or !(Test-Path -LiteralPath $executable -PathType Leaf)) { throw 'QA_INSTALL_FAILED' }
            $env:FINDLINK_STARTER_VERSION = $Version
            $entry = Join-Path $installDir 'resources/app.asar/dist/main/index.js'
            node scripts/starter-desktop-smoke.mjs "--module=$entry"
            if ($LASTEXITCODE -ne 0) { throw 'QA_INSTALLED_DESKTOP_SMOKE_FAILED' }
          }

          function Uninstall-Qa {
            $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0 -or (Test-Path -LiteralPath $executable)) { throw 'QA_UNINSTALL_FAILED' }
          }

          if (Test-Path -LiteralPath $appData) { throw 'QA_APPDATA_ALREADY_EXISTS' }
          Install-Qa '0.5.4'
          $fixture = Join-Path $appData 'csd-desktop/data/collections/crawl-qa/results.json'
          New-Item -ItemType Directory -Path (Split-Path -Parent $fixture) -Force | Out-Null
          Set-Content -LiteralPath $fixture -Value '{"facebook":[{"post_id":"qa-retained-post"}],"threads":[]}' -Encoding utf8
          $expectedHash = (Get-FileHash -LiteralPath $fixture).Hash

          function Assert-ResultsPreserved {
            if ((Get-FileHash -LiteralPath $fixture).Hash -ne $expectedHash) { throw 'QA_SAVED_RESULTS_CHANGED' }
          }

          Install-Qa '0.5.5' -Update
          Assert-ResultsPreserved
          Uninstall-Qa
          Assert-ResultsPreserved
          Install-Qa '0.5.5'
          Assert-ResultsPreserved
          Write-Output 'STARTER_WINDOWS_INSTALL_UPGRADE_REINSTALL_PASSED'

  signed-update:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify the signed installer and update through HTTPS
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'EXPECTED_DISPOSABLE_WINDOWS_RUNNER' }
          $testDir = Join-Path $env:RUNNER_TEMP ('findlink-certificates-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $testDir | Out-Null
          $store = 'Cert:\CurrentUser\My'
          $until = (Get-Date).AddDays(1)
          $testRoot = New-SelfSignedCertificate -Type Custom -Subject 'CN=FindLink Windows CI Test Root' -CertStoreLocation $store `
            -KeyUsage CertSign,CRLSign -TextExtension '2.5.29.19={critical}{text}ca=1&pathlength=0' `
            -HashAlgorithm SHA256 -NotAfter $until.AddDays(1)
          $publisher = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=FindLink Windows CI Test Publisher' `
            -CertStoreLocation $store -Signer $testRoot -HashAlgorithm SHA256 -NotAfter $until
          $serverCert = New-SelfSignedCertificate -Type SSLServerAuthentication -DnsName localhost -CertStoreLocation $store `
            -Signer $testRoot -KeyExportPolicy Exportable -HashAlgorithm SHA256 -NotAfter $until

          $rootFile = Join-Path $testDir 'root.cer'
          Export-Certificate -Cert $testRoot -FilePath $rootFile | Out-Null
          Import-Certificate -FilePath $rootFile -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          $rootPem = Join-Path $testDir 'root.pem'
          $rootBase64 = [Convert]::ToBase64String($testRoot.RawData, [Base64FormattingOptions]::InsertLineBreaks)
          [IO.File]::WriteAllText($rootPem, "-----BEGIN CERTIFICATE-----`n$rootBase64`n-----END CERTIFICATE-----`n")
          $env:NODE_EXTRA_CA_CERTS = $rootPem
          $env:FINDLINK_TEST_TLS_PFX = Join-Path $testDir 'localhost.pfx'
          $env:FINDLINK_TEST_TLS_PASSWORD = [guid]::NewGuid().ToString('N')
          $pfxPassword = ConvertTo-SecureString -String $env:FINDLINK_TEST_TLS_PASSWORD -AsPlainText -Force
          Export-PfxCertificate -Cert $serverCert -FilePath $env:FINDLINK_TEST_TLS_PFX -Password $pfxPassword `
            -CryptoAlgorithmOption AES256_SHA256 | Out-Null
          $env:FINDLINK_SIGNING_CERT_SHA1 = $publisher.Thumbprint
          $env:FINDLINK_SIGNING_PUBLISHER = $publisher.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          npm run test:starter-signed-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
