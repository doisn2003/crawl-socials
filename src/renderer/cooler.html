<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>CSD &gt; Make it cooler</title>
    <link rel="stylesheet" href="./cooler.css">
    <script type="module" src="./cooler.js"></script>
</head>

<body>
    <header>
        <div class="heading"><span>&gt;_ CSD / MAKE IT COOLER</span><span id="phase" role="status">ĐANG KẾT NỐI</span>
        </div>
        <div id="meters">
            <section aria-label="Tiến độ Facebook">
                <div class="meter-label"><span>FACEBOOK</span><span id="facebook-count">0 / — bài</span></div><progress
                    id="facebook-progress" max="1" value="0" aria-label="Tiến độ Facebook"></progress>
                <p id="facebook-state">Đang chờ</p>
            </section>
            <section aria-label="Tiến độ Threads">
                <div class="meter-label"><span>THREADS</span><span id="threads-count">0 / — bài</span></div><progress
                    id="threads-progress" max="1" value="0" aria-label="Tiến độ Threads"></progress>
                <p id="threads-state">Đang chờ</p>
            </section>
        </div>
    </header>
    <main id="binary-region"><canvas id="binary" aria-hidden="true"></canvas><span class="overlay">Thingking...</span>
    </main>
    <footer><span id="connection">Tiến độ thực tế · Cập nhật mỗi giây</span><span>Đóng cửa sổ này vẫn tiếp tục thu
            thập.</span></footer>
</body>

</html>
